<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 - Sunshine Pay 관리자센터</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="admin-layout">
        <!-- 사이드바 오버레이 -->
        <div class="sidebar-overlay"></div>

        <!-- 사이드바 -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-section-title">PAY</div>
                <ul class="sidebar-menu">
                    <li><a href="index.html">수기결제</a></li>
                </ul>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-section-title">PAYMENT</div>
                <ul class="sidebar-menu">
                    <li><a href="#">실시간 결제내역</a></li>
                </ul>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-section-title">SETTLEMENT</div>
                <ul class="sidebar-menu">
                    <li><a href="settlement.html">실시간 정산조회</a></li>
                </ul>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-section-title">BOARD</div>
                <ul class="sidebar-menu">
                    <li><a href="referral.html" class="active">공지사항</a></li>
                </ul>
            </div>
        </aside>

        <!-- 메인 컨텐츠 -->
        <div class="main-content">
            <!-- 헤더 -->
            <header>
                <div class="header-left">
                    <button class="hamburger-menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <div class="logo">
                        <span class="logo-sunshine">Sunshine</span>
                        <span class="logo-pay">Pay</span>
                        <span class="logo-subtitle">관리자센터</span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="header-icon">🔍</div>
                    <div class="header-icon">👤</div>
                </div>
            </header>

            <!-- 컨텐츠 영역 -->
            <div class="content-area">
                <!-- 페이지 헤더 -->
                <div class="page-header">
                    <h2>공지사항</h2>
                </div>

                <!-- 검색 영역 -->
                <div class="search-area">
                    <select>
                        <option>검색</option>
                        <option>제목검색</option>
                        <option>내용검색</option>
                    </select>
                    <input type="text" placeholder="검색어를 입력하세요">
                    <button class="search-button">🔍 검색</button>
                </div>

                <!-- 테이블 -->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>번호</th>
                                <th>제목</th>
                                <th>작성일</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="3" style="padding: 60px; text-align: center; color: #999;">
                                    <div style="font-size: 48px; margin-bottom: 20px;">📋</div>
                                    <div style="font-size: 16px;">조회된 내역이 없습니다.</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 푸터 -->
                <footer>
                    <p>📄 원성페이먼츠 사업자 정보 ▼</p>
                    <p>© 2025 WONSUNG PAYMENTS. All rights reserved.</p>
                </footer>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
