<body>
    <div class="admin-layout">
        <!-- 사이드바 오버레이 -->
        <div class="sidebar-overlay"></div>

        <!-- 사이드바 -->
        <aside class="sidebar">
            <div class="sidebar-section">

                </ul>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-section-title">SETTLEMENT</div>
                <ul class="sidebar-menu">
                    <li><a href="settlement.html">실시간 정산조회</a></li>

            </div>
            <div class="sidebar-section">
                <div class="sidebar-section-title">BOARD</div>

                    <li><a href="referral.html">공지사항</a></li>

            </div>
            <div class="sidebar-section">

                    <li><a href="aa.html" class="active">관리</a></li>

        <!-- 메인 컨텐츠 -->
        <div class="main-content">
            <!-- 헤더 -->
            <header>
                <div class="header-left">
                    <button class="hamburger-menu">
                        <span></span>
                        <span></span>

                    </button>
                    <div class="logo">
                        <span class="logo-king">King</span>
                        <span class="logo-pay">Pay</span>
                        <span class="logo-subtitle">관리자센터</span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="header-icon">🔍</div>
                    <div class="header-icon">👤</div>
                </div>
            </header>

            <!-- 컨텐츠 영역 -->
            <div class="content-area">
                <!-- 페이지 헤더 -->
                <div class="page-header">
                    <h2>관리 페이지</h2>
                </div>

                <!-- 필터 탭 -->
                <div class="filter-tabs filter-tabs-4">

                    <div class="filter-tab">설정</div>

                <!-- 컨텐츠 카드 -->
                <div class="table-container">
                    <div style="padding: 40px;">
                        <h3 style="margin-bottom: 20px; color: #333;">시스템 현황</h3>

                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px;">
                            <div style="background: #f8f9fa; padding: 24px; border-radius: 8px; border-left: 4px solid #007bff;">
                                <div style="font-size: 14px; color: #666; margin-bottom: 8px;">총 결제 건수</div>
                                <div style="font-size: 28px; font-weight: bold; color: #007bff;">0건</div>
                            </div>
                            <div style="background: #f8f9fa; padding: 24px; border-radius: 8px; border-left: 4px solid #28a745;">

                                <div style="font-size: 28px; font-weight: bold; color: #ffc107;">0명</div>
                            </div>
                            <div style="background: #f8f9fa; padding: 24px; border-radius: 8px; border-left: 4px solid #dc3545;">
                                <div style="font-size: 14px; color: #666; margin-bottom: 8px;">시스템 상태</div>
                                <div style="font-size: 28px; font-weight: bold; color: #28a745;">정상</div>
                            </div>
                        </div>

                        <h3 style="margin-bottom: 20px; color: #333;">최근 활동</h3>
                        <div style="background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 40px; text-align: center;">
                            <div style="font-size: 48px; margin-bottom: 16px;">📊</div>
                            <div style="color: #999; font-size: 16px;">최근 활동 내역이 없습니다.</div>
                        </div>
                    </div>
                </div>

                <!-- 푸터 -->
                <footer>
                    <p>📄 킹페이먼츠 사업자 정보 ▼</p>
                    <p>© 2025 KING PAYMENTS. All rights reserved.</p>
