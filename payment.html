<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 결제내역 - King Pay 관리자센터</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="admin-layout">
        <!-- 사이드바 오버레이 -->
        <div class="sidebar-overlay"></div>

        <!-- 사이드바 -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-section-title">PAY</div>
                <ul class="sidebar-menu">
                    <li><a href="index.html">수기결제</a></li>
                </ul>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-section-title">PAYMENT</div>
                <ul class="sidebar-menu">
                    <li><a href="payment.html" class="active">실시간 결제내역</a></li>
                </ul>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-section-title">SETTLEMENT</div>
                <ul class="sidebar-menu">
                    <li><a href="settlement.html">실시간 정산조회</a></li>
                </ul>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-section-title">BOARD</div>
                <ul class="sidebar-menu">
                    <li><a href="referral.html">공지사항</a></li>
                </ul>
            </div>
        </aside>

        <!-- 메인 컨텐츠 -->
        <div class="main-content">
            <!-- 헤더 -->
            <header>
                <div class="header-left">
                    <button class="hamburger-menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <div class="logo">
                        <span class="logo-king">King</span>
                        <span class="logo-pay">Pay</span>
                        <span class="logo-subtitle">관리자센터</span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="header-icon">🔍</div>
                    <div class="header-icon">👤</div>
                </div>
            </header>

            <!-- 컨텐츠 영역 -->
            <div class="content-area">
                <!-- 페이지 헤더 -->
                <div class="page-header">
                    <h2>실시간 결제내역</h2>
                </div>

                <!-- 통계 카드 -->
                <div class="stats-grid stats-grid-4">
                    <div class="stat-card purple">
                        <div class="stat-card-title">오늘 결제</div>
                        <div class="stat-card-value">0원</div>
                        <div class="stat-card-subtitle">승인 0건 / 취소 0건</div>
                    </div>
                    <div class="stat-card green">
                        <div class="stat-card-title">12월 누적</div>
                        <div class="stat-card-value">0원</div>
                        <div class="stat-card-subtitle">승인 4,000 / 취소 -4,000</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-title">오늘 승인</div>
                        <div class="stat-card-value">0원</div>
                        <div class="stat-card-subtitle">0건</div>
                    </div>
                    <div class="stat-card red">
                        <div class="stat-card-title">오늘 취소</div>
                        <div class="stat-card-value">0원</div>
                        <div class="stat-card-subtitle">0건</div>
                    </div>
                </div>

                <!-- 검색 영역 -->
                <div class="search-area">
                    <input type="date" value="20251223">
                    <span>~</span>
                    <input type="date" value="20251223">
                    <select>
                        <option>전체</option>
                        <option>승인</option>
                        <option>취소</option>
                    </select>
                    <input type="text" placeholder="검색어 입력">
                    <button class="search-button">검색</button>
                </div>

                <!-- 테이블 -->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>번호</th>
                                <th>결제일시</th>
                                <th>상점명</th>
                                <th>결제수단</th>
                                <th>결제금액</th>
                                <th>상태</th>
                                <th>승인번호</th>
                                <th>구매자</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="8" style="padding: 60px; text-align: center; color: #999;">
                                    <div style="font-size: 48px; margin-bottom: 20px;">💳</div>
                                    <div style="font-size: 16px;">조회된 결제 내역이 없습니다.</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 푸터 -->
                <footer>
                    <p>📄 킹페이먼츠 사업자 정보 ▼</p>
                    <p>© 2025 KING PAYMENTS. All rights reserved.</p>
                </footer>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
